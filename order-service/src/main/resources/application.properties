spring.application.name=order-service
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:h2:mem:orders;LOCK_TIMEOUT=60000
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}